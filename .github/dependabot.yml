version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    groups:
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - wrangler
      effect:
        patterns:
          - effect
          - "@effect/*"
      mantine:
        patterns:
          - "@mantine/*"
          - "@gfazioli/*"
      react:
        patterns:
          - react
          - react-dom
          - react-router
          - "@types/react"
          - "@types/react-dom"
      minor-dependencies:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
        exclude-patterns:
          - "@cloudflare/*"
          - wrangler
          - effect
          - "@effect/*"
          - "@mantine/*"
          - "@gfazioli/*"
          - react
          - react-dom
          - react-router
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
