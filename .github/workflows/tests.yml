name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Unit and Workerd tests
        run: npm test
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Browser parity tests
        run: npm run test:browser
      - name: Portable build and deployment dry run
        run: npm run deploy:check
      - name: Production build and deployment dry run
        run: npm run deploy:check:production
      - name: Test build and deployment dry run
        run: npm run deploy:check:test
